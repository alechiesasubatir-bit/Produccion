<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&display=swap"
      rel="stylesheet"
    />
    <title>ProdControl</title>
    <script>
      // Restaura la ruta guardada por 404.html (GitHub Pages) antes de montar React.
      try {
        var ruta = sessionStorage.getItem('prodcontrol_ruta')
        if (ruta) {
          sessionStorage.removeItem('prodcontrol_ruta')
          history.replaceState(null, '', ruta)
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
