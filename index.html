<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@300..700&family=Geist+Mono:wght@400..500&family=Manrope:wght@800&family=DM+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <title>Control de Producción</title>
    <script>
      // Cada deploy borra el código anterior: si el navegador quedó con un index.html viejo en caché,
      // el script de la app da 404 y la página queda en blanco. Se recarga una vez salteando la caché.
      window.addEventListener(
        'error',
        function (e) {
          var s = e.target
          if (!s || s.tagName !== 'SCRIPT' || s.type !== 'module') return
          try {
            if (sessionStorage.getItem('prodcontrol_recarga')) return
            sessionStorage.setItem('prodcontrol_recarga', '1')
          } catch (x) {}
          var u = new URL(location.href)
          u.searchParams.set('v', String(Date.now()))
          location.replace(u.toString())
        },
        true,
      )
    </script>
    <script>
      // Restaura la ruta guardada por 404.html (GitHub Pages) antes de montar React.
      try {
        var ruta = sessionStorage.getItem('prodcontrol_ruta')
        if (ruta) {
          sessionStorage.removeItem('prodcontrol_ruta')
          history.replaceState(null, '', ruta)
        }
      } catch (e) {}
    </script>
    <style>
      /* Inicio: el mismo del Sistema de Compras, sobre fondo blanco */
      #intro-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        transition: opacity 0.5s ease;
      }
      #intro-overlay.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .intro-logo-wrap {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .intro-ring {
        position: absolute;
        border-radius: 50%;
        border: 2px solid rgba(249, 115, 22, 0.35);
        animation: ring-pulse 2s ease-out infinite;
      }
      .intro-ring:nth-child(1) { width: 200px; height: 200px; animation-delay: 0s; }
      .intro-ring:nth-child(2) { width: 260px; height: 260px; animation-delay: 0.4s; border-color: rgba(249, 115, 22, 0.2); }
      .intro-ring:nth-child(3) { width: 320px; height: 320px; animation-delay: 0.8s; border-color: rgba(249, 115, 22, 0.1); }
      @keyframes ring-pulse {
        0% { transform: scale(0.7); opacity: 0; }
        40% { opacity: 1; }
        100% { transform: scale(1.1); opacity: 0; }
      }
      .intro-logo {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        object-fit: cover;
        box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.5), 0 0 40px rgba(249, 115, 22, 0.3), 0 20px 60px rgba(0, 0, 0, 0.18);
        animation: logo-in 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        position: relative;
        z-index: 2;
      }
      @keyframes logo-in {
        0% { transform: scale(0.4); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .intro-tagline {
        text-align: center;
        animation: tag-in 0.6s 0.5s ease both;
      }
      @keyframes tag-in {
        0% { transform: translateY(12px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }
      .intro-tagline .it-name {
        font-family: 'Manrope', sans-serif;
        font-size: 22px;
        font-weight: 800;
        color: #15181e;
        letter-spacing: 0.04em;
        display: block;
        margin-bottom: 4px;
      }
      .intro-tagline .it-sub {
        font-family: 'DM Sans', sans-serif;
        font-size: 11px;
        color: rgba(21, 24, 30, 0.55);
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="intro-overlay">
      <div class="intro-logo-wrap">
        <div class="intro-ring"></div>
        <div class="intro-ring"></div>
        <div class="intro-ring"></div>
        <img class="intro-logo" src="/logo-subatir.jpg" alt="Subatir S.A." />
      </div>
      <div class="intro-tagline">
        <span class="it-name">Subatir S.A.</span>
        <span class="it-sub">Sistema de Control de Producción</span>
      </div>
    </div>
    <script>
      ;(function () {
        var ov = document.getElementById('intro-overlay')
        function closeIntro() {
          ov.classList.add('fade-out')
          setTimeout(function () {
            ov.style.display = 'none'
          }, 520)
        }
        // En las pruebas automáticas (Playwright) no se muestra: taparía la pantalla.
        if (navigator.webdriver) {
          ov.style.display = 'none'
          return
        }
        ov.addEventListener('click', closeIntro)
        setTimeout(closeIntro, 3200)
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
